<div class="site-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Routecraft home">
      <span class="brand-mark">R</span>
      <span>routecraft<span class="brand-period">.</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/user" routerLinkActive="is-active">User space</a>
      <a routerLink="/admin" routerLinkActive="is-active">Admin Panel</a>
    </nav>
    <span class="topbar-note"><span class="status-dot"></span> Routing playground</span>
  </header>

  <main class="page-content">
    <router-outlet />
  </main>

  <footer class="site-footer">
    <span>ROUTECRAFT · NESTED ROUTES PRACTICE</span>
    <span>One shell, multiple destinations.</span>
  </footer>
</div>
